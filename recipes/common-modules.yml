---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: files
    files:
      - source: system
        destination: /
   
  - type: dnf
    repos:
    
      copr:
        - atim/starship
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        - https://negativo17.org/repos/fedora-multimedia.repo
        - gundulabs.repo
       # - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$releasever.noarch.rpm
       # - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-44.noarch.rpm
         
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
        - https://packages.gundulabs.com/keys/gundulabs-repo.asc
      nonfree: rpmfusion 
      
    group-install:
      install-weak-deps: false
      exclude:
        - gdm
        - gnome-shell
        - gnome-session
        - gnome-session-wayland-session
        - gnome-system-monitor
        - nheko
        - gnome-disk-utility
        - rhythmbox
        - thunderbird
        - libreoffice-*
        
      packages:
        - virtualization
        - cosmic-desktop-environment
    
     
    install:
      install-weak-deps: false
      exclude:
        - gdm
        - gnome-shell
        - gnome-session
        - gnome-session-wayland-session
        - gnome-system-monitor
        - nheko
        - rhythmbox
        - thunderbird
        - gnome-disk-utility
        - libreoffice-*
      
      packages:
                
        # COSMIC integration
        #- flatpak
        #- gnome-keyring-pam
        #- toolbox
        - playerctl
        - pop-sound-theme
        - lxpolkit
        - gaze
        - gaze-gui
        - akmod-intel-ipu6 
        - intel-ipu6-firmware 
        - v4l2-relayd
              
        # Applications
        - gnome-calculator
        - waydroid
                
        # Profiling
        - sysprof
        - bpftrace
        - perf
        
        # Terminal
        - fastfetch
        - micro
        - starship
        
        # Scanning
        #- sane-backends
        #- sane-backends-drivers-scanners
        #- sane-airscan
        - libjpeg8
        - gscan2pdf
        - djvulibre
        - unpaper
        
        # Printing
        #- cups
        #- cups-pk-helper
        #- system-config-printer
        #- cups-filters
        #- cups-filters-driverless
        #- cups-browsed
        #- ipp-usb
        #- avahi
        #- bluez-cups
                
        # Network diagnostics
        - nmap
        #- mtr
        - iperf3
        #- bind-utils
        - wireshark-cli
        - netcat
        #- net-tools
        #- tcpdump
        #- traceroute
        - tailscale
        #- ethtool

        # Hardware diagnostics
        #- nvme-cli
        #- smartmontools
        - lm_sensors
        #- lshw
        #- pciutils
        #- usbutils
        #- dmidecode

        # Storage and filesystem support
        #- cifs-utils
        #- nfs-utils
        #- ntfs-3g
        #- exfatprogs
        #- dosfstools
        #- gdisk
        #- gparted
        - samba 
        - samba-common 
        - samba-client
        - kde-partitionmanager

        # General diagnostics
        #- htop
        - btop
        - iotop-c
        #- lsof
        - strace

        # Browser
        - brave-browser
       
        
  - type: script
    scripts:
        - set-default-wallpaper.sh

  - type: brew

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          
          - us.zoom.Zoom
          - org.kde.kate
          - org.kde.kdenlive
          - org.kde.gwenview
          - org.shotcut.Shotcut
          - md.obsidian.Obsidian
          - com.obsproject.Studio
          - org.pvermeer.WebAppHub
          - com.ranfdev.DistroShelf
          - com.bambulab.BambuStudio
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - io.missioncenter.MissionCenter
          - io.podman_desktop.PodmanDesktop
          
         
    

  - type: initramfs
